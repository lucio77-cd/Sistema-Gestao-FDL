<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Bebidas — Vencimentos e Estoque</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-pagina-atual="gerente">
  <header class="topo">
    <div class="topo-marca">Bebidas</div>
    <div class="topo-sub" id="nome-estabelecimento">Carregando…</div>
    <button type="button" id="link-sair" class="btn-secundario" style="margin-top:0.5rem">Sair</button>
  </header>

  <main>
    <div class="segmentado" role="tablist" aria-label="Visão">
      <button type="button" id="seg-vencimentos" class="ativo" role="tab" aria-selected="true">Vencimentos</button>
      <button type="button" id="seg-estoque" role="tab" aria-selected="false">Estoque</button>
    </div>

    <section id="secao-vencimentos">
      <div id="resumo" class="resumo" hidden>
        <div class="resumo-numero" id="resumo-numero"></div>
        <div class="resumo-texto" id="resumo-texto"></div>
      </div>

      <p class="legenda" id="legenda-atualizacao">—</p>

      <div id="bloco-grafico" hidden>
        <div class="filtros">
          <select id="filtro-periodo" aria-label="Período do gráfico">
            <option value="7">Próximos 7 dias</option>
            <option value="14" selected>Próximos 14 dias</option>
            <option value="30">Próximos 30 dias</option>
          </select>
        </div>
        <div class="painel">
          <canvas id="grafico-vencimentos"></canvas>
          <p class="mensagem-vazio" id="grafico-sem-dados" hidden>Nenhum dado neste período.</p>
        </div>
      </div>

      <div id="lista-lotes">
        <div class="skeleton-lote"><div class="skeleton-linha skeleton-linha--titulo"></div><div class="skeleton-linha skeleton-linha--meta"></div></div>
        <div class="skeleton-lote"><div class="skeleton-linha skeleton-linha--titulo"></div><div class="skeleton-linha skeleton-linha--meta"></div></div>
      </div>
    </section>

    <section id="secao-estoque" hidden>
      <p class="legenda">Tudo que tem hoje, pra saber o que precisa pedir.</p>
      <div class="filtros">
        <select id="filtro-estoque-local" aria-label="Filtrar por local">
          <option value="todos">Todos os locais</option>
          <option value="Geladeira">Geladeira</option>
          <option value="Estoque seco">Estoque seco</option>
        </select>
      </div>
      <div class="painel" id="tabela-estoque">
        <p class="mensagem-vazio">Carregando…</p>
      </div>
    </section>

    <p id="erro-token" class="aviso-erro" hidden>Link inválido ou expirado.</p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script type="module" src="js/gerente.js"></script>
</body>
</html>
