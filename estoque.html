<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Estoque — Controle de Bebidas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body data-pagina-atual="estoque">
  <header class="topo">
    <div class="topo-marca">Controle de Bebidas</div>
    <div class="topo-sub" id="nome-estabelecimento">Carregando…</div>
  </header>
  <nav class="tabbar" aria-label="Navegação principal">
    <a href="index.html" class="tabbar-item" data-pagina="dashboard"><span>Início</span></a>
    <a href="vistoria.html" class="tabbar-item" data-pagina="vistoria"><span>Vistoria</span></a>
    <a href="promocoes.html" class="tabbar-item" data-pagina="promocoes"><span>Promoções</span></a>
    <a href="produtos.html" class="tabbar-item" data-pagina="produtos"><span>Produtos</span></a>
    <button type="button" class="tabbar-item" id="btn-mais" aria-haspopup="true" aria-expanded="false"><span>Mais</span></button>
  </nav>
  <div class="menu-mais" id="menu-mais" hidden>
    <a href="caixa.html" data-pagina="caixa">Caixa</a>
    <a href="configuracoes.html" data-pagina="configuracoes">Configurações</a>
    <a href="#" id="link-sair">Sair</a>
  </div>

  <main>
    <h1>Estoque</h1>
    <p class="legenda">Quanto você tem de cada produto, separado por local. Esta contagem é independente da Vistoria (que cuida só dos vencimentos).</p>

    <div class="painel" id="painel-importacao" hidden>
      <h2 style="margin-top:0">Importar contagem já feita</h2>
      <p class="legenda" id="texto-importacao"></p>
      <div id="conferencia-importacao"></div>
      <button type="button" class="btn" id="btn-confirmar-importacao">Confirmar importação</button>
    </div>

    <div class="segmentado" role="tablist" aria-label="Local da contagem">
      <button type="button" id="seg-geladeira" class="ativo" role="tab" aria-selected="true">Contando: Geladeira</button>
      <button type="button" id="seg-seco" role="tab" aria-selected="false">Contando: Seco</button>
    </div>

    <div class="barra-busca">
      <input type="search" id="campo-busca" placeholder="Buscar produto" autocomplete="off" />
    </div>

    <div id="lista-estoque">
      <p class="mensagem-vazio">Carregando…</p>
    </div>
  </main>

  <script type="module" src="js/estoque.js"></script>
</body>
</html>
