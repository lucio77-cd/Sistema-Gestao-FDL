<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Entrar — Controle de Bebidas</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div class="cartao-login">
      <h1>Controle de Bebidas</h1>
      <p class="legenda">Entre com sua conta para gerenciar o estoque.</p>
      <form id="form-login">
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="username" />

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password" />

        <button type="submit" class="btn" style="width:100%">Entrar</button>
        <p id="erro-login" class="aviso-erro" hidden></p>
      </form>
    </div>
  </main>

  <script type="module" src="js/login.js"></script>
</body>
</html>
